tool: tavily
# Both setups read pages with advanced extract, as the board's runs did; site: filters move into include_domains.
setups:
  tavily_advanced:
    provider_slug: tavily-advanced
    provider_name: Tavily advanced
    config_slug: tavily-advanced
    endpoint: POST /search search_depth=advanced
    env_keys: [TAVILY_API_KEY]
    native_fetch: true
    fetch_endpoint: POST /extract
    fetch_kind: tavily_extract
    request_config: {search_depth: advanced, chunks_per_source: 3, extract_depth: advanced, site_operator_policy: include_domains}
    pricing:
      search_usd: 0.016
      fetch_usd: 0.0032
  tavily_basic:
    provider_slug: tavily-basic
    provider_name: Tavily basic
    config_slug: tavily-basic
    endpoint: POST /search search_depth=basic
    env_keys: [TAVILY_API_KEY]
    native_fetch: true
    fetch_endpoint: POST /extract
    fetch_kind: tavily_extract
    request_config: {search_depth: basic, extract_depth: advanced, site_operator_policy: include_domains}
    pricing:
      search_usd: 0.008
      fetch_usd: 0.0032
