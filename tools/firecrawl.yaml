tool: firecrawl
# Priced at the Hobby plan, the cheapest paid plan: $19 a month for 5,000 credits, so $0.0038 a credit.
# A search of up to 10 results is 2 credits, a page is 1 (firecrawl.dev/pricing, read 25 Nov 2026).
setups:
  firecrawl:
    provider_slug: firecrawl-search
    provider_name: Firecrawl
    config_slug: firecrawl
    endpoint: POST /v2/search
    env_keys: [FIRECRAWL_API_KEY]
    native_fetch: true
    fetch_endpoint: POST /v2/scrape
    fetch_kind: firecrawl_scrape
    request_config: {}
    pricing:
      search_usd: 0.0076
      fetch_usd: 0.0038
